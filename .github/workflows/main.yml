name: Test APK

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        run: |
          curl -L -o instagram.apk \
          "https://github.com/forgotenmywin/Khoshtib/releases/download/instagram-439/instagram.apk"

      - name: Test File
        run: |
          echo "===== FILE SIZE ====="
          ls -lh instagram.apk

          echo "===== FILE TYPE ====="
          file instagram.apk

          echo "===== FIRST 20 LINES ====="
          head -20 instagram.apk || true

          echo "===== ZIP TEST ====="
          unzip -t instagram.apk || true
