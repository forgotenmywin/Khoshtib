name: Android Emulator Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        run: |
          curl -L -o instagram.apk \
          https://github.com/forgotenmywin/Khoshtib/releases/download/jjljkjl/instagram-441-0-0-0-72.apk

      - name: Check APK
        run: |
          ls -lh instagram.apk
          file instagram.apk

      - name: Run Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          cores: 2
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb wait-for-device

            adb devices

            adb install -r instagram.apk

            adb shell monkey -p com.instagram.android \
              -c android.intent.category.LAUNCHER 1

            sleep 10

            adb exec-out screencap -p > screenshot.png

            ls -lh screenshot.png

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
