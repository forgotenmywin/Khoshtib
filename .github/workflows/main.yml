name: Check Runner

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Show runner info
        run: |
          echo "===== uname ====="
          uname -a

          echo "===== Architecture ====="
          uname -m

          echo "===== CPU ====="
          sysctl -n machdep.cpu.brand_string || true

          echo "===== OS ====="
          sw_vers || true
