name: Verify APK

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file unzip

      - name: Download APK
        run: |
          wget -O instagram.apk "https://github.com/forgotenmywin/Khoshtib/releases/download/jjljkjl/instagram-441-0-0-0-72.apk"

      - name: Show file info
        run: |
          echo "===== FILE SIZE ====="
          ls -lh instagram.apk

          echo "===== FILE TYPE ====="
          file instagram.apk

      - name: Verify APK
        run: |
          echo "===== ZIP TEST ====="
          unzip -t instagram.apk

          echo "===== CONTENTS ====="
          unzip -l instagram.apk | head -50

          echo "===== CHECK AndroidManifest ====="
          unzip -l instagram.apk | grep "AndroidManifest.xml"

          echo "===== CHECK classes.dex ====="
          unzip -l instagram.apk | grep "classes.dex"

          echo "===== CHECK META-INF ====="
          unzip -l instagram.apk | grep "META-INF"

      - name: Result
        run: |
          if unzip -l instagram.apk | grep -q "AndroidManifest.xml" && \
             unzip -l instagram.apk | grep -q "classes.dex"; then
            echo "✅ VALID APK"
          else
            echo "❌ NOT A VALID APK"
            exit 1
          fi
