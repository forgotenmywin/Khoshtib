name: Firebase Test Lab

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: starry-polymer-482712-b2

      - name: Download APK
        run: |
          wget -O instagram.apk \
          "https://github.com/forgotenmywin/Khoshtib/releases/download/jjljkjl/instagram-441-0-0-0-72.apk"

      - name: Verify APK
        run: |
          ls -lh instagram.apk
          file instagram.apk

      - name: Run Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --project=starry-polymer-482712-b2 \
            --type=robo \
            --app=instagram.apk \
            --device=model=MediumPhone.arm,version=34,locale=en,orientation=portrait \
            --timeout=10m \
            --results-bucket=gs://test-lab-$(date +%s)
