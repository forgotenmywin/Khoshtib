name: List Firebase Test Lab Devices

on:
  workflow_dispatch:

jobs:
  list-devices:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: starry-polymer-482712-b2

      - name: Show account
        run: |
          gcloud auth list
          gcloud config list

      - name: List Android models
        run: |
          gcloud firebase test android models list

      - name: List Android versions
        run: |
          gcloud firebase test android versions list
