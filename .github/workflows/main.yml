name: Upload APK

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          curl --http1.1 -L --retry 10 --retry-delay 5 \
          "https://ramrod-unroll-degree.ngrok-free.dev/base.apk" \
          -o base.apk

      - name: Show APK
        run: |
          ls -lh base.apk

      - name: Push to GitHub
        env:
          TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git remote set-url origin https://x-access-token:${TOKEN}@github.com/forgotenmywin/Khoshtib.git

          git add base.apk

          git commit -m "Upload base.apk" || true

          git push origin HEAD:main
